<html>
<head>
    <title>Review Detail</title>
</head>
<body>
    <h1>{{ review.reviewer_name }}</h1>
    <h3>By {{ review.author_name }}</h3>
    <h4>published_on: {{ review.picture }}</h4>
    <h4>picture: {{ review.published_on}}</h4>
   
    {% if review.picture %}
        <img src="{{ review.picture.url }}" alt="Review picture">
    {% else %}
    <p>No Cover Page for this book</p>
    {% endif %}
</body>
</html>
